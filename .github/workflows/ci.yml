name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, линтер, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Кеш pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Интеграционные тесты ядра
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cell
          POSTGRES_PASSWORD: cell
          POSTGRES_DB: cell_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cell -d cell_test" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://cell:cell@localhost:5432/cell_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @renote/core test:int

  build-core:
    name: Сборка ядра
    runs-on: ubuntu-latest
    needs: check
    env:
      # Сборке нужен конфиг, но не настоящая база и хранилище.
      DATABASE_URL: postgres://build:build@localhost:5432/build
      PAYLOAD_SECRET: build-only
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: build
      S3_ACCESS_KEY_ID: build
      S3_SECRET_ACCESS_KEY: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @renote/core build
